version: "3.9"

services:
  app:
    build: .
    container_name: daily_management_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:////data/daily_mgmt.db
    volumes:
      - sqlite_data:/data
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
