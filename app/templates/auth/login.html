<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Daily Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body style="background:linear-gradient(135deg,#1e293b 0%,#1e40af 50%,#1e293b 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;">

<div class="w-full max-w-md px-4">

  <!-- Logo -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white text-blue-700 font-black text-2xl mb-4 shadow-lg">DM</div>
    <h1 class="text-2xl font-bold text-white">Daily Management</h1>
    <p class="text-blue-200 text-sm mt-1">Gestion Lean & Visuel — IIoT / OT</p>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-2xl p-8">
    <h2 class="text-xl font-bold text-slate-800 mb-6">Se connecter</h2>

    {% if error %}
    <div class="flash-message flash-error mb-5">✕ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label for="email" class="form-label">Adresse email</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="vous@domaine.fr" required autocomplete="email" value="{{ email | default('') }}" />
      </div>
      <div>
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary w-full py-2.5 text-sm justify-center mt-2">Se connecter →</button>
    </form>

    <div class="relative my-5">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
      <div class="relative flex justify-center"><span class="bg-white px-3 text-xs text-slate-400">ou</span></div>
    </div>

    <button type="button" disabled class="w-full flex items-center justify-center gap-3 px-4 py-2.5 border border-slate-200 rounded-lg text-sm text-slate-400 cursor-not-allowed bg-slate-50 opacity-60">
      <svg width="18" height="18" viewBox="0 0 21 21"><rect x="0" y="0" width="10" height="10" fill="#f25022"/><rect x="11" y="0" width="10" height="10" fill="#7fba00"/><rect x="0" y="11" width="10" height="10" fill="#00a4ef"/><rect x="11" y="11" width="10" height="10" fill="#ffb900"/></svg>
      Connexion Microsoft (disponible en Phase 2)
    </button>
  </div>

  <!-- Comptes démo -->
  <div class="mt-5 bg-white/10 backdrop-blur rounded-xl p-4 border border-white/20">
    <h3 class="text-xs font-bold text-blue-100 uppercase tracking-wider mb-3">Comptes de démonstration</h3>
    <div class="space-y-1.5 text-xs">
      <div class="flex justify-between"><span class="text-white font-semibold">Admin</span><span class="text-blue-200 font-mono">admin@dailymgmt.local / Admin123!</span></div>
      <div class="flex justify-between"><span class="text-white font-semibold">Manager OT</span><span class="text-blue-200 font-mono">manager.ot@dailymgmt.local / Manager123!</span></div>
      <div class="flex justify-between"><span class="text-white font-semibold">Membre</span><span class="text-blue-200 font-mono">ingenieur1@dailymgmt.local / Member123!</span></div>
    </div>
  </div>
</div>
<script src="/static/js/main.js"></script>
</body>
</html>
