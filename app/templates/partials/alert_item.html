{# Alerte individuelle — bouton résoudre via /htmx/alerts/{id}/resolve #}
<div id="alert-{{ alert.id }}" class="text-sm rounded-lg p-3 border
  {% if alert.is_resolved %}bg-slate-50 border-slate-200{% elif alert.type == 'blocker' or alert.type == 'escalation' %}bg-red-50 border-red-200{% elif alert.type == 'delay' %}bg-amber-50 border-amber-200{% else %}bg-orange-50 border-orange-200{% endif %}">
  <div class="flex items-start justify-between gap-2">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full flex-shrink-0
        {% if alert.is_resolved %}bg-slate-400
        {% elif alert.type == 'blocker' or alert.type == 'escalation' %}bg-red-500
        {% elif alert.type == 'delay' %}bg-amber-500
        {% else %}bg-orange-500{% endif %}"></span>
      <span class="font-semibold capitalize
        {% if alert.is_resolved %}text-slate-500{% elif alert.type == 'blocker' %}text-red-700{% elif alert.type == 'delay' %}text-amber-700{% else %}text-orange-700{% endif %}">
        {{ alert.type }}
      </span>
    </div>
    {% if alert.is_resolved %}
    <span class="text-emerald-600 text-xs font-semibold">✓ Résolu</span>
    {% endif %}
  </div>
  <p class="mt-1.5 text-slate-600 leading-relaxed">{{ alert.message[:120] }}{% if alert.message|length > 120 %}...{% endif %}</p>
  {% if not alert.is_resolved %}
  <button
    hx-post="/htmx/alerts/{{ alert.id }}/resolve"
    hx-target="#alert-{{ alert.id }}"
    hx-swap="outerHTML"
    class="btn btn-success btn-xs mt-2"
  >✓ Résoudre</button>
  {% endif %}
</div>
