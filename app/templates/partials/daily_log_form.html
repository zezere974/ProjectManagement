{# Formulaire standup — HTMX form POST vers /htmx/projects/{id}/daily-log #}
<form
  hx-post="/htmx/projects/{{ project.id }}/daily-log"
  hx-target="#daily-log-result"
  hx-swap="innerHTML"
  class="space-y-4"
  x-data="{mood: 3}"
>
  <div>
    <label class="form-label"><span class="text-emerald-600">✓</span> Qu'est-ce qui a été fait ?</label>
    <textarea name="what_done" placeholder="Actions réalisées aujourd'hui..." class="form-input text-sm" rows="3" required></textarea>
  </div>

  <div>
    <label class="form-label"><span class="text-blue-500">→</span> Qu'est-ce qui est prévu pour demain ?</label>
    <textarea name="what_planned" placeholder="Actions planifiées pour demain..." class="form-input text-sm" rows="3" required></textarea>
  </div>

  <div>
    <label class="form-label"><span class="text-red-500">⚠</span> Bloqueurs (optionnel)</label>
    <input type="text" name="blockers" placeholder="Obstacles ou points de blocage..." class="form-input text-sm" />
  </div>

  <div>
    <label class="form-label">Humeur équipe — <span class="font-bold text-slate-800" x-text="mood"></span>/5</label>
    <div class="flex items-center gap-4">
      <input type="range" name="mood_score" min="1" max="5" x-model="mood" class="flex-1 accent-blue-600" />
      <div class="mood-indicator flex-shrink-0"
        :class="{'mood-1':mood<=1,'mood-2':mood==2,'mood-3':mood==3,'mood-4':mood==4,'mood-5':mood>=5}"
        x-text="['😞','😕','😐','😊','😄'][mood-1]">
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-full">
    💾 Enregistrer le standup
  </button>

  <div id="daily-log-result"></div>
</form>
