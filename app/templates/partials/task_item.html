{# Ligne de tâche — checkbox toggle via /htmx/tasks/{id}/toggle, suppression sans confirm #}
<div id="task-{{ task.id }}" class="flex items-center gap-3 py-2.5 px-3 rounded-lg hover:bg-slate-50 group transition-colors border border-transparent hover:border-slate-100">

  <!-- Checkbox toggle (POST vers endpoint HTMX retournant HTML) -->
  <button
    hx-post="/htmx/tasks/{{ task.id }}/toggle"
    hx-target="#task-{{ task.id }}"
    hx-swap="outerHTML"
    class="flex-shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center transition-all cursor-pointer
      {% if task.status == 'done' %}bg-emerald-500 border-emerald-500 text-white
      {% elif task.status == 'blocked' %}border-red-400 bg-red-50
      {% else %}border-slate-300 hover:border-blue-500 bg-white{% endif %}"
    title="{% if task.status == 'done' %}Marquer non terminé{% else %}Marquer terminé{% endif %}"
  >
    {% if task.status == 'done' %}
    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
    </svg>
    {% endif %}
  </button>

  <!-- Titre tâche -->
  <div class="flex-1 min-w-0 flex items-center gap-2 flex-wrap">
    <span class="text-sm {% if task.status == 'done' %}line-through text-slate-400{% elif task.status == 'blocked' %}text-red-600{% else %}text-slate-800{% endif %}">
      {{ task.title }}
    </span>
    {% if task.is_quick_win %}
    <span class="text-xs bg-amber-100 text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded-full">⚡ Quick Win</span>
    {% endif %}
    {% if task.due_date %}
    <span class="text-xs text-slate-400">📅 {{ task.due_date }}</span>
    {% endif %}
    {% if task.assigned_to %}
    <span class="text-xs text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity">{{ task.assigned_to.username }}</span>
    {% endif %}
  </div>

  <!-- Bouton suppression (sans hx-confirm) -->
  <button
    hx-delete="/htmx/tasks/{{ task.id }}"
    hx-target="#task-{{ task.id }}"
    hx-swap="outerHTML swap:0.2s"
    class="text-slate-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100 flex-shrink-0 p-0.5"
    title="Supprimer"
  >
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
    </svg>
  </button>
</div>
